[project]
name = "bae6-authn"
version = "0.0.0"
description = "Python SDK for the bae6-authn token and identity API"
requires-python = ">=3.12"
dependencies = [
    "bae6-sdk-core",
    "httpx>=0.28.1",
]

[tool.uv.sources]
bae6-sdk-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bae6_authn"]
