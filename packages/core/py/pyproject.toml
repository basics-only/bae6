[project]
name = "bae6-sdk-core"
version = "0.0.0"
description = "Shared HTTP transport for the bae6 Python SDKs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bae6_sdk_core"]
