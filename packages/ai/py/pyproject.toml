[project]
name = "bae6-ai"
version = "0.0.0"
description = "Python SDK for the bae6-ai gateway"
requires-python = ">=3.12"
dependencies = [
    "bae6-sdk-core",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[tool.uv.sources]
bae6-sdk-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bae6_ai"]
