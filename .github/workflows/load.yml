name: load

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Stress level
        type: choice
        options: [smoke, average, stress, spike, soak]
        default: smoke
      orgs:
        description: Organizations to spread users over (1-20)
        default: "20"
      concurrency:
        description: Optional comma-separated users per row, overriding the profile
        default: ""

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONTAINER_RUNTIME: docker
      PROFILE: context
      LOAD_PROFILE: ${{ inputs.profile }}
      LOAD_ORGS: ${{ inputs.orgs }}
      LOAD_CONCURRENCY: ${{ inputs.concurrency }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make up
      - run: node e2e/load/load.mjs | tee load.jsonl
      - run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ inputs.profile }}-${{ github.run_id }}
          path: load.jsonl
      - if: always()
        run: make down
