name: bae6

x-dev: &dev
  NODE_ENV: development
  BAE6_ALLOW_HTTP_JWKS: "true"

x-health: &health
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    profiles: [authn, authz, ai, context, console, all]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev-only-admin}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:-dev-only-openfga}
      AUTHN_DB_PASSWORD: ${AUTHN_DB_PASSWORD:-dev-only-authn}
      AUTHZ_DB_PASSWORD: ${AUTHZ_DB_PASSWORD:-dev-only-authz}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-dev-only-ai}
      EMBED_DB_PASSWORD: ${EMBED_DB_PASSWORD:-dev-only-embed}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-dev-only-mcp}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-dev-only-agent}
      EVAL_DB_PASSWORD: ${EVAL_DB_PASSWORD:-dev-only-eval}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./compose/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  authn:
    image: localhost/bae6-authn-api:dev
    build:
      context: ..
      dockerfile: services/authn/api/Dockerfile
    profiles: [authn, ai, context, console, all]
    <<: *health
    environment:
      <<: *dev
      BAE6_AUTHN_DATABASE_URL: postgres://authn:${AUTHN_DB_PASSWORD:-dev-only-authn}@postgres:5432/authn
      BAE6_AUTHN_SECRETS_DIR: /run/secrets/authn
      BAE6_AUTHN_KEYS_DIR: /run/secrets/authn-keys
      BAE6_AUTHN_ALLOW_HTTP: "true"
      BAE6_AUTHN_HTTP_ORIGIN: "true"
      BAE6_AUTHN_TENANT_HOSTS: acme.bae6.localhost:8091=acme
      BAE6_AUTHN_ISSUER: http://authn:8080
      BAE6_AUTHN_AUDIENCES: bae6-authn,bae6-authz,bae6-ai,eval-worker,agent-worker,data-api,embed-api,mcp-gateway,mcp-registry
      BAE6_AUTHN_SIGNING_KEYS: dev-signing.pem
      BAE6_AUTHN_SESSION_CLIENTS: console
      BAE6_AUTHN_TOKEN_TARGETS: bae6-ai=bae6-authz
    volumes:
      - authn-keys:/run/secrets/authn-keys:ro
      - authn-secrets:/run/secrets/authn:ro
    ports:
      - "127.0.0.1:8092:8080"
    depends_on:
      postgres: {condition: service_healthy}
      authn-keys: {condition: service_completed_successfully}

  authn-keys:
    image: localhost/bae6-authn-api:dev
    profiles: [authn, ai, context, console, all]
    user: "0"
    command:
      - node
      - -e
      - |
        const fs = require("node:fs");
        const crypto = require("node:crypto");
        const write = (name, make) => {
          const path = `/keys/$${name}`;
          if (!fs.existsSync(path)) fs.writeFileSync(path, make(), { mode: 0o600 });
          fs.chownSync(path, 1000, 1000);
        };
        write("dev-signing.pem", () => crypto.generateKeyPairSync("ec", { namedCurve: "P-256" })
          .privateKey.export({ type: "pkcs8", format: "pem" }));
        write("token-client-console", () => crypto.randomBytes(32).toString("base64url"));
        fs.copyFileSync("/keys/token-client-console", "/console/authn-client-secret");
        fs.chownSync("/console/authn-client-secret", 1000, 1000);
        write("token-client-placement", () => crypto.randomBytes(32).toString("base64url"));
        fs.copyFileSync("/keys/token-client-placement", "/authz/authn-placement-secret");
        fs.chownSync("/authz/authn-placement-secret", 1000, 1000);
        write("token-client-bae6-ai", () => crypto.randomBytes(32).toString("base64url"));
        fs.copyFileSync("/keys/token-client-bae6-ai", "/ai/authn-client-secret");
        fs.chownSync("/ai/authn-client-secret", 1000, 1000);
        fs.writeFileSync("/secrets/mock-idp-authn-client", "dev-only-authn-client", { mode: 0o600 });
        fs.chownSync("/secrets/mock-idp-authn-client", 1000, 1000);
    volumes:
      - authn-keys:/keys
      - console-authn:/console
      - authz-authn:/authz
      - ai-authn:/ai
      - authn-secrets:/secrets

  authn-seed:
    image: localhost/bae6-authn-api:dev
    profiles: [authn, ai, context, console, all]
    environment:
      BAE6_AUTHN_DATABASE_URL: postgres://authn:${AUTHN_DB_PASSWORD:-dev-only-authn}@postgres:5432/authn
    command:
      - node
      - -e
      - |
        const pg = require("pg");
        const db = new pg.Client({
          connectionString: process.env.BAE6_AUTHN_DATABASE_URL,
          connectionTimeoutMillis: 5000,
          statement_timeout: 15000,
        });
        (async () => {
          await db.connect();
          // Dev only: the mock IdP is plain http, which the production schema refuses.
          await db.query(`
            ALTER TABLE provider_connections
              DROP CONSTRAINT IF EXISTS provider_connections_issuer_check,
              ADD CONSTRAINT provider_connections_issuer_check CHECK (issuer ~ '^https?://' AND length(issuer) <= 512);
            ALTER TABLE external_identities
              DROP CONSTRAINT IF EXISTS external_identities_issuer_check,
              ADD CONSTRAINT external_identities_issuer_check CHECK (issuer ~ '^https?://' AND length(issuer) <= 512);
            INSERT INTO provider_connections
              (tenant_id, id, kind, issuer, client_id, client_secret_ref, jit_provisioning, display_name)
            VALUES ('acme', 'entra', 'entra', 'http://mock-oidc:8080/entra/11111111-1111-4111-8111-111111111111/v2.0',
                    'bae6-authn', 'mock-idp-authn-client', true, 'Mock Entra')
            ON CONFLICT (tenant_id, id) DO UPDATE SET
              kind = EXCLUDED.kind, issuer = EXCLUDED.issuer, client_id = EXCLUDED.client_id,
              client_secret_ref = EXCLUDED.client_secret_ref, jit_provisioning = true,
              display_name = EXCLUDED.display_name, status = 'active', updated_at = now();
            INSERT INTO provider_connections
              (tenant_id, id, kind, issuer, client_id, client_secret_ref, jit_provisioning, display_name)
            VALUES ('acme', 'workloads', 'oidc', 'http://mock-oidc:8080', 'bae6-authn-workloads',
                    'mock-idp-authn-client', false, 'Mock workloads')
            ON CONFLICT (tenant_id, id) DO NOTHING;
            INSERT INTO principals (id, tenant_id, type, owner_application_id) VALUES
              ('prn_d0000000000000000000000000000001', 'acme', 'service', 'demo'),
              ('prn_d0000000000000000000000000000002', 'acme', 'service', 'demo')
            ON CONFLICT DO NOTHING;
            INSERT INTO external_identities
              (id, tenant_id, principal_id, provider_connection_id, issuer, subject, last_verified_at) VALUES
              ('xid_d0000000000000000000000000000001', 'acme', 'prn_d0000000000000000000000000000001',
               'workloads', 'http://mock-oidc:8080', 'embed-worker', now()),
              ('xid_d0000000000000000000000000000002', 'acme', 'prn_d0000000000000000000000000000002',
               'workloads', 'http://mock-oidc:8080', 'research-agent', now())
            ON CONFLICT DO NOTHING`);
          await db.end();
        })().catch((err) => {
          console.error(err.message);
          process.exit(1);
        });
    depends_on:
      authn: {condition: service_healthy}

  openfga-migrate:
    image: openfga/openfga:v1.10.2
    profiles: [authz, ai, context, all]
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:-dev-only-openfga}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.10.2
    profiles: [authz, ai, context, all]
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:-dev-only-openfga}@postgres:5432/openfga?sslmode=disable
      OPENFGA_LIST_OBJECTS_MAX_RESULTS: ${OPENFGA_LIST_OBJECTS_MAX_RESULTS:-1000}
      OPENFGA_TRACE_ENABLED: ${BAE6_OPENFGA_TRACE:-false}
      OPENFGA_TRACE_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  authz-api: &authz-api
    image: localhost/bae6-authz-api:dev
    build:
      context: ..
      dockerfile: services/authz/api/Dockerfile
    profiles: [authz, ai, context, all]
    <<: *health
    environment:
      PORT: "8080"
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_LIST_OBJECTS_MAX_RESULTS: ${OPENFGA_LIST_OBJECTS_MAX_RESULTS:-1000}
      BAE6_DATABASE_URL: postgres://authz:${AUTHZ_DB_PASSWORD:-dev-only-authz}@postgres:5432/authz
      NODE_ENV: development
      BAE6_AUTH_MODE: fixture
      BAE6_FIXTURE_AUTH_FILE: /etc/authz/auth.json
      BAE6_FIXTURE_END_USERS_FILE: /etc/authz/end-users.json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      BAE6_METRICS_PORT: ${BAE6_METRICS_PORT:-}
      BAE6_METRICS_HOST: 0.0.0.0
    volumes:
      - ./compose/authz/auth.json:/etc/authz/auth.json:ro
      - ./compose/authz/end-users.json:/etc/authz/end-users.json:ro
      - authz-authn:/run/secrets/authn:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started

  authz-api-replica:
    <<: *authz-api
    profiles: [replicas]
    ports: []
    deploy:
      replicas: ${BAE6_REPLICAS:-2}

  authz-lb:
    image: nginx:1.27.3-alpine
    profiles: [replicas]
    volumes:
      - ./compose/authz/lb.nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      authz-api-replica:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    volumes:
      - ./compose/authz/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  mock-oidc:
    image: localhost/bae6-mock-oidc:dev
    build:
      context: ..
      dockerfile: deploy/dev/mock-oidc/Dockerfile
    profiles: [authn, ai, context, console, all]
    environment:
      NODE_ENV: development
      MOCK_OIDC_ISSUER: http://mock-oidc:8080
      MOCK_OIDC_CLIENT_AUDIENCE: bae6-context-mcp
      MOCK_OIDC_PUBLIC_URL: http://localhost:8085
    ports:
      - "127.0.0.1:8085:8080"

  mock-oidc-other:
    image: localhost/bae6-mock-oidc:dev
    build:
      context: ..
      dockerfile: deploy/dev/mock-oidc/Dockerfile
    profiles: [context, all]
    environment:
      NODE_ENV: development
      MOCK_OIDC_ISSUER: http://mock-oidc-other:8080
    ports:
      - "127.0.0.1:8086:8080"

  mock-cloud:
    image: localhost/bae6-mock-cloud:dev
    build:
      context: ./dev/mock-cloud
    profiles: [ai, context, all]
    environment:
      MOCK_CLOUD: "1"
      MOCK_EMBED_DIMENSIONS: "64"
      MOCK_S3_OBJECTS: >-
        {"docs":{
        "example/handbook.txt":"Expense reports are reimbursed within ten business days of approval.",
        "example/security.txt":"Production access requires a ticket and a second reviewer.",
        "other/private.txt":"Not part of the example organization."}}

  mock-mcp:
    image: localhost/bae6-mock-mcp:dev
    build:
      context: ./dev/mock-mcp
    profiles: [context, all]
    environment:
      NODE_ENV: development

  token-minter:
    image: docker.io/curlimages/curl:8.11.1
    profiles: [ai, context, all]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if idp=$$(curl -sf -X POST http://mock-oidc:8080/token \
              -d '{"sub":"embed-worker","aud":"bae6-authn-workloads","ttlSeconds":900}') &&
            body=$$(curl -sf -X POST http://authn:8080/auth/token \
              --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
              --data-urlencode subject_token_type=urn:ietf:params:oauth:token-type:access_token \
              --data-urlencode "subject_token=$$(echo "$$idp" | sed -E 's/.*"access_token":"([^"]+)".*/\1/')" \
              --data-urlencode audience=bae6-ai); then
            echo "$$body" | sed -E 's/.*"access_token":"([^"]+)".*/\1/' > /tokens/ai.tmp
            mv /tokens/ai.tmp /tokens/ai
            sleep 60
          else
            sleep 1
          fi
        done
    user: "0"
    volumes:
      - tokens:/tokens
    healthcheck:
      test: ["CMD", "test", "-s", "/tokens/ai"]
      interval: 1s
      timeout: 2s
      retries: 60
    depends_on:
      mock-oidc: {condition: service_started}
      authn-seed: {condition: service_completed_successfully}

  ai-gateway:
    image: localhost/bae6-ai-gateway:dev
    build:
      context: ..
      dockerfile: services/ai/gateway/Dockerfile
    profiles: [ai, context, all]
    <<: *health
    environment:
      <<: *dev
      BAE6_ALLOW_CUSTOM_PROVIDER_ENDPOINTS: "true"
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      BAE6_DATABASE_URL: postgres://ai:${AI_DB_PASSWORD:-dev-only-ai}@postgres:5432/ai
      BAE6_AUTHN_URL: http://authn:8080
      BAE6_AUTHN_CLIENT_SECRET_FILE: /run/secrets/authn/authn-client-secret
      BAE6_AUTHZ_URL: http://authz-api:8080
      BAE6_AI_CONFIG: >-
        {"priceBook":{"version":"integration","prices":{
        "chat-mock":{"inputPerMTok":"3","outputPerMTok":"15"},
        "embed-mock":{"inputPerMTok":"0.1","outputPerMTok":"0"}}},
        "models":[
        {"id":"chat-mock","provider":"bedrock","providerModel":"mock.chat-v1","region":"us-east-1","endpoint":"http://mock-cloud:8080","operations":["chat"],"inputModalities":["text"],"maxInputTokens":8000,"maxOutputTokens":1000},
        {"id":"embed-mock","provider":"bedrock","providerModel":"mock.embed-v1","region":"us-east-1","endpoint":"http://mock-cloud:8080","operations":["embed"],"inputModalities":["text"],"maxInputTokens":8000,"maxOutputTokens":1}],
        "budgets":{"acme":"100"}}
    volumes:
      - ai-authn:/run/secrets/authn:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres: {condition: service_healthy}
      authn: {condition: service_healthy}
      authz-api: {condition: service_healthy}
      mock-cloud: {condition: service_started}

  data-api:
    image: localhost/bae6-context-data-api:dev
    build:
      context: ..
      dockerfile: services/context/data-api/Dockerfile
    profiles: [context, all]
    <<: *health
    environment:
      <<: *dev
      BAE6_ALLOW_HTTP_SOURCES: "true"
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      BAE6_DATA_ISSUERS: >-
        [{"issuer":"http://mock-oidc:8080","audience":"bae6-context-data","jwksUri":"http://mock-oidc:8080/.well-known/jwks.json","organization":"example","application":"demo"},{"issuer":"http://mock-oidc-other:8080","audience":"bae6-context-data","jwksUri":"http://mock-oidc-other:8080/.well-known/jwks.json","organization":"other","application":"demo"}]
      BAE6_DATA_CONFIG: >-
        {"sources":[{"id":"docs","organization":"example","kind":"s3","region":"us-east-1","bucket":"docs","prefix":"example/","endpoint":"http://mock-cloud:8080"}]}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mock-oidc: {condition: service_started}
      mock-oidc-other: {condition: service_started}
      mock-cloud: {condition: service_started}

  embed-api:
    image: localhost/bae6-context-embed-api:dev
    build:
      context: ..
      dockerfile: services/context/embed-api/Dockerfile
    profiles: [context, all]
    <<: *health
    environment:
      <<: *dev
      BAE6_ALLOW_HTTP_SOURCES: "true"
      AWS_ACCESS_KEY_ID: mock
      AWS_SECRET_ACCESS_KEY: mock
      BAE6_EMBED_DATABASE_URL: postgres://embed:${EMBED_DB_PASSWORD:-dev-only-embed}@postgres:5432/embed
      BAE6_AI_URL: http://ai-gateway:8080
      BAE6_AI_TOKEN_FILE: /tokens/ai
      BAE6_EMBED_ISSUERS: >-
        [{"issuer":"http://mock-oidc:8080","audience":"bae6-context-embed","jwksUri":"http://mock-oidc:8080/.well-known/jwks.json","organization":"example","application":"demo"},{"issuer":"http://mock-oidc-other:8080","audience":"bae6-context-embed","jwksUri":"http://mock-oidc-other:8080/.well-known/jwks.json","organization":"other","application":"demo"}]
      BAE6_EMBED_CONFIG: >-
        {"collections":[{"id":"kb","organization":"example","model":{"id":"embed-mock","dimensions":64},
        "source":{"region":"us-east-1","bucket":"docs","prefix":"example/","endpoint":"http://mock-cloud:8080"},
        "acl":[{"prefix":"","principals":["user:alice"]}]}]}
    volumes:
      - tokens:/tokens:ro
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres: {condition: service_healthy}
      ai-gateway: {condition: service_healthy}
      token-minter: {condition: service_healthy}
      mock-cloud: {condition: service_started}

  mcp-registry:
    image: localhost/bae6-context-mcp-registry:dev
    build:
      context: ..
      dockerfile: services/context/mcp-registry/Dockerfile
    profiles: [context, all]
    <<: *health
    environment:
      <<: *dev
      BAE6_MCP_ALLOW_INSECURE_ENDPOINTS: "true"
      BAE6_MCP_DATABASE_URL: postgres://mcp:${MCP_DB_PASSWORD:-dev-only-mcp}@postgres:5432/mcp
      BAE6_MCP_ISSUERS: >-
        [{"issuer":"http://mock-oidc:8080","audience":"bae6-context-mcp","jwksUri":"http://mock-oidc:8080/.well-known/jwks.json","organization":"example","application":"demo"}]
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      postgres: {condition: service_healthy}
      mock-oidc: {condition: service_started}

  agent-worker:
    image: localhost/bae6-ai-agent-worker:dev
    build:
      context: ..
      dockerfile: services/ai/agent-worker/Dockerfile
    profiles: [ai, all]
    <<: *health
    environment:
      <<: *dev
      PORT: "8080"
      BAE6_DATABASE_URL: postgres://agents:${AGENT_DB_PASSWORD:-dev-only-agent}@postgres:5432/agents
      BAE6_AI_GATEWAY_URL: http://ai-gateway:8080
      BAE6_MODEL_MAX_OUTPUT_TOKENS: "512"
      BAE6_WORKER_TOKEN_FILE: /tokens/ai
      BAE6_AI_ISSUERS: >-
        [{"issuer":"http://mock-oidc:8080","audience":"bae6-ai-agents","jwksUri":"http://mock-oidc:8080/.well-known/jwks.json","organization":"example","application":"demo"}]
    volumes:
      - tokens:/tokens:ro
    ports:
      - "127.0.0.1:8087:8080"
    depends_on:
      postgres: {condition: service_healthy}
      ai-gateway: {condition: service_healthy}
      token-minter: {condition: service_healthy}

  eval-worker:
    image: localhost/bae6-ai-eval-worker:dev
    build:
      context: ..
      dockerfile: services/ai/eval-worker/Dockerfile
    profiles: [ai, all]
    <<: *health
    environment:
      <<: *dev
      PORT: "8080"
      BAE6_DATABASE_URL: postgres://evals:${EVAL_DB_PASSWORD:-dev-only-eval}@postgres:5432/evals
      BAE6_AI_GATEWAY_URL: http://ai-gateway:8080
      BAE6_WORKER_TOKEN_FILE: /tokens/ai
      BAE6_AI_ISSUERS: >-
        [{"issuer":"http://mock-oidc:8080","audience":"bae6-ai-evals","jwksUri":"http://mock-oidc:8080/.well-known/jwks.json","organization":"example","application":"demo"}]
    volumes:
      - tokens:/tokens:ro
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      postgres: {condition: service_healthy}
      ai-gateway: {condition: service_healthy}
      token-minter: {condition: service_healthy}

  mcp-gateway:
    image: localhost/bae6-context-mcp-gateway:dev
    build:
      context: ..
      dockerfile: services/context/mcp-gateway/Dockerfile
    profiles: [context, all]
    <<: *health
    environment:
      <<: *dev
      PORT: "8080"
      BAE6_MCP_ALLOW_INSECURE_ENDPOINTS: "true"
      BAE6_MCP_CACHE_TTL_MS: "1000"
      BAE6_MCP_REGISTRY_URL: http://mcp-registry:8080
      BAE6_MCP_REGISTRY_CREDENTIALS: >-
        {"example":{"tokenUrl":"http://mock-oidc:8080/token","clientId":"mcp-gateway","clientSecret":"dev-only","scope":"mcp:discover"}}
      BAE6_MCP_ISSUERS: >-
        [{"issuer":"http://mock-oidc:8080","audience":"bae6-context-mcp-gateway","jwksUri":"http://mock-oidc:8080/.well-known/jwks.json","organization":"example","application":"demo"}]
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      mcp-registry: {condition: service_healthy}
      mock-oidc: {condition: service_started}

  console:
    image: localhost/bae6-console:dev
    build:
      context: ..
      dockerfile: services/console/Dockerfile
    profiles: [console, all]
    environment:
      ORIGIN: ${CONSOLE_ORIGIN:-http://acme.bae6.localhost:8091}
      BAE6_AUTHN_URL: http://authn:8080
      BAE6_AUTHN_CLIENT_SECRET_FILE: /run/secrets/authn/authn-client-secret
      BAE6_AUTHZ_URL: http://authz-api:8080
      BAE6_AI_URL: http://ai-gateway:8080
      BAE6_EVAL_URL: http://eval-worker:8080
      BAE6_AGENT_URL: http://agent-worker:8080
      BAE6_MCP_REGISTRY_URL: http://mcp-registry:8080
    volumes:
      - console-authn:/run/secrets/authn:ro
    depends_on:
      authn: {condition: service_healthy}
      authn-seed: {condition: service_completed_successfully}

  console-edge:
    image: nginx:1.27.3-alpine
    profiles: [console, all]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./compose/console/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      console: {condition: service_started}
      authn: {condition: service_healthy}

volumes:
  pgdata:
  tokens:
  authn-keys:
  authz-authn:
  ai-authn:
  authn-secrets:
  console-authn:
