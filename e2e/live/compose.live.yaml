services:
  ai-gateway:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?}
      BAE6_AI_CONFIG: >-
        {"priceBook":{"version":"live","prices":{
        "chat-live":{"inputPerMTok":"1","outputPerMTok":"5"}}},
        "models":[
        {"id":"chat-live","provider":"bedrock","providerModel":"${BAE6_LIVE_BEDROCK_MODEL:?}","region":"${AWS_REGION:?}","operations":["chat"],"inputModalities":["text"],"maxInputTokens":2000,"maxOutputTokens":64}],
        "budgets":{"example":"1"}}

  data-api:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?}
      BAE6_DATA_CONFIG: >-
        {"sources":[{"id":"docs","organization":"example","kind":"s3","region":"${AWS_REGION:?}","bucket":"${BAE6_LIVE_S3_BUCKET:?}","prefix":"example/"}]}
