# helm install bae6-authn <bae6-platform checkout>/charts/bae6-service \
#   -f services/authn/api/values.yaml --set image.digest=sha256:...
image:
  repository: ghcr.io/basics-only/bae6-authn-api

replicas: 2
autoscaling:
  minReplicas: 2
  # BAE6_AUTHN_DB_POOL_MAX x maxReplicas must fit the database's connection share.
  maxReplicas: 6

terminationGracePeriodSeconds: 60

env:
  BAE6_SHUTDOWN_DELAY_MS: "10000"
  BAE6_AUTHN_DB_POOL_MAX: "10"
  BAE6_AUTHN_SECRETS_DIR: /run/secrets/authn
  BAE6_AUTHN_KEYS_DIR: /run/secrets/authn-keys
  # Required per deployment: the hosts this replica serves sign-in for, as host=tenant pairs.
  BAE6_AUTHN_TENANT_HOSTS: ""
  BAE6_AUTHN_ISSUER: ""
  BAE6_AUTHN_AUDIENCES: ""
  BAE6_AUTHN_SESSION_CLIENTS: console
  # Which services may re-exchange a user's token, and for which audiences, e.g. mcp-gateway=data-api|embed-api. Unlisted services cannot.
  BAE6_AUTHN_TOKEN_TARGETS: ""
  # Rotate: add the new key here and roll out; once every replica has it, point the active key at it.
  BAE6_AUTHN_SIGNING_KEYS: ""
  BAE6_AUTHN_ACTIVE_SIGNING_KEY: ""

envFromSecrets:
  - name: BAE6_AUTHN_DATABASE_URL
    secret: bae6-authn
    key: database-url

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

networkPolicy:
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 5432
        # Identity providers and Microsoft Graph.
        - port: 443
