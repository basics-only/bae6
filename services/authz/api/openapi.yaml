openapi: 3.1.0
info:
  title: bae6-authz API
  version: 1.0.0
  summary: Organization-wide authorization control plane.
  description: |
    Single source of truth for the bae6-authz HTTP API. SDKs and the API implementation
    are written against this file.

    **Identity and scoping are never taken from request bodies.**
    - The calling workload is identified by its bearer token (`bearerAuth`).
    - The end user is identified by a verified end-user token (`endUserToken`),
      never by a user ID in a body or query.
    - OpenFGA store IDs and authorization model IDs are resolved server-side per
      application and environment; no request accepts them.

    **Applications.** An application's `id` is server-assigned as
    `<name>-<environment>` and is the only application reference in requests. The
    bearer token carries an allow-list of application IDs (`*` covers every
    application, for platform administrators). For application reads, an unknown
    application and one the token is not allow-listed for are indistinguishable
    (`404 not_found`), so existence is not leaked. Checks against an application
    the workload is not bound to are `403 forbidden`, decided before the
    application is looked up, so that also says nothing about existence. A
    workload's allow-list is its bindings (`/v1/workload-bindings`), and it holds
    only the `check` scope. A missing scope is `403 forbidden`. Registering an
    application needs `applications:write` and the `*` allow-list, since a
    duplicate would otherwise reveal that an ID exists.

    **End users.** `endUserToken` is a JWT verified against the configured issuer
    and audience. The principal is `user:<sub>`. Checks without an end user
    (service principals) are not supported. An invalid or expired end-user token
    is `401 invalid_end_user_token`, distinct from a bad bearer token.

    **Actors.** Mutations are authorized by scope plus the application allow-list
    and audited with the bearer token's subject as actor. Human administrators
    (the console) use bearer tokens issued for their own identity.
    `Relationship.subject` is tuple data, not the caller's identity.

    **Fail closed.** `indeterminate` is never an allow. Clients must treat any
    non-200 response, timeout, or unrecognized `status` or error `code` as a
    deny. Authorization outage on a check is `200` with `indeterminate`; `503`
    is returned only when the API itself cannot answer.

    **Request IDs.** Every response carries `X-Request-Id`, equal to the
    `requestId` in its body. A well-formed caller-supplied `X-Request-Id`
    (1 to 64 characters of `A-Z a-z 0-9 . _ -`) is reused; otherwise one is generated.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: check
    description: Permission checks.
  - name: applications
    description: Registered applications.
  - name: relationships
    description: Relationship tuples within one application's store.
  - name: models
    description: Authorization models bound to an application.
  - name: audit
    description: Audit events.
  - name: tenant
    description: The tenant org tree, authenticated with a bae6 token from authn.
  - name: health
    description: Liveness and readiness.
security:
  - bearerAuth: []
paths:
  /v1/check:
    post:
      tags: [check]
      operationId: check
      summary: Check one permission
      description: |
        Evaluates whether the end user identified by `endUserToken` holds
        `relation` on `object`. If authorization is unavailable the response is
        `200` with `status: indeterminate`; it is never an allow.
        Required scope: `check`.
      security:
        - bearerAuth: [check]
          endUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
            examples:
              read-document:
                value:
                  application: crm
                  relation: read
                  object: document:d1
      responses:
        "200":
          description: Decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
              examples:
                allow:
                  value:
                    status: allow
                    requestId: req_01HZX3
                    modelId: 01HZX3MODEL
                deny:
                  value:
                    status: deny
                    requestId: req_01HZX4
                    modelId: 01HZX3MODEL
                outage:
                  summary: Authorization backend unavailable; treat as deny.
                  value:
                    status: indeterminate
                    requestId: req_01HZX5
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/batch-check:
    post:
      tags: [check]
      operationId: batchCheck
      summary: Check several permissions
      description: |
        At most 100 items (`400 batch_too_large` above that). `correlationId`s
        must be unique within the batch (`400 duplicate_correlation_id`; the whole
        batch is rejected). The response has exactly one result per item. One item
        being `indeterminate` does not affect others. Required scope: `check`.
      security:
        - bearerAuth: [check]
          endUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCheckRequest"
            examples:
              two-documents:
                value:
                  application: crm
                  checks:
                    - { correlationId: a, relation: read, object: "document:d1" }
                    - { correlationId: b, relation: delete, object: "document:d1" }
      responses:
        "200":
          description: Per-item decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCheckResponse"
              examples:
                mixed:
                  value:
                    requestId: req_01HZX6
                    modelId: 01HZX3MODEL
                    results:
                      - { correlationId: a, status: allow }
                      - { correlationId: b, status: deny }
                outage:
                  value:
                    requestId: req_01HZX7
                    results:
                      - { correlationId: a, status: indeterminate }
                      - { correlationId: b, status: indeterminate }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/list-objects:
    post:
      tags: [check]
      operationId: listObjects
      summary: List the objects of a type the end user holds a relation on
      description: |
        Returns object IDs in ascending order, at most `limit` (1 to 100, default 100)
        per page. Pass `nextCursor` back as `cursor` for the next page; its absence
        means the last page. Each page is evaluated afresh, so pages reflect the
        relationships at the time each is requested. OpenFGA caps one evaluation
        (by default 1000 objects or 3 seconds), so a very large result can be
        incomplete without notice: use `check` for a decision on a specific object.
        If authorization is unavailable the response is `200` with `code` set and
        no objects; it never lists an object it could not confirm.
        Required scope: `check`.
      security:
        - bearerAuth: [check]
          endUserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListObjectsRequest"
            examples:
              readable-documents:
                value:
                  application: crm
                  relation: read
                  type: document
                  limit: 2
      responses:
        "200":
          description: One page of objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectsResponse"
              examples:
                page:
                  value:
                    requestId: req_01HZX8
                    modelId: 01HZX3MODEL
                    objects: ["document:d1", "document:d2"]
                    nextCursor: ZG9jdW1lbnQ6ZDI
                outage:
                  value:
                    requestId: req_01HZX9
                    objects: []
                    code: timeout
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      tags: [applications]
      operationId: getCaller
      summary: The caller's own scopes and application allow-list
      description: |
        Lets a client hide actions the API would refuse. It is a hint only: every
        request is still authorized on its own. Needs no scope beyond authentication.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Caller"
        "401":
          $ref: "#/components/responses/Error"
  /v1/applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: List applications
      description: "Required scope: `applications:read`."
      security:
        - bearerAuth: [applications:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [applications]
      operationId: createApplication
      summary: Register an application
      description: |
        Provisions the application's isolated store and binds its model. The
        resulting `id` is `<name>-<environment>`; a duplicate is `409 conflict`.
        Required scope: `applications:write`.
      security:
        - bearerAuth: [applications:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/applications/{id}:
    get:
      tags: [applications]
      operationId: getApplication
      summary: Get an application
      description: "Required scope: `applications:read`."
      security:
        - bearerAuth: [applications:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationId"
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/tenant/resources/unit:
    put:
      tags: [tenant]
      summary: Register a resource in an org unit
      operationId: placeTenantResource
      description: >
        Requires a bae6 tenant token and app_admin on the target unit.
        Repeating the same placement is safe. A placement in another unit returns
        409. After durable registration, a projection outage returns 503 and the
        service retries projection in the background.
      security:
        - bae6Token: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, resourceId, unit]
              properties:
                resourceType:
                  type: string
                  enum: [application, api, model, agent_definition, prompt, mcp_server, tool, dataset, document, service_resource]
                resourceId:
                  type: string
                  pattern: '^[A-Za-z0-9_@.+|-]{1,256}$'
                unit:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      responses:
        "200":
          description: The resource placement is registered and projected.
          content:
            application/json:
              schema:
                type: object
                required: [resourceType, resourceId, unit, auditEventId]
                properties:
                  resourceType:
                    type: string
                  resourceId:
                    type: string
                  unit:
                    type: string
                  auditEventId:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenant/resources/{resourceType}/{resourceId}/access/{subject}:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
          enum: [application, api, model, agent_definition, prompt, mcp_server, tool, dataset, document, service_resource]
      - name: resourceId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_@.+|-]{1,256}$" }
      - name: subject
        in: path
        required: true
        description: "`<type>:<id>` or `group:<id>#member`, percent-encoded. No wildcards."
        schema: { type: string }
    put:
      tags: [tenant]
      operationId: grantTenantResourceAccess
      summary: Let a principal or group use a resource
      description: |
        Writes the resource type's access relation (`invoker` for a model, `reader` for a
        document, and so on). The actor needs `access_admin` on the resource's unit. The
        unit's guardrails still apply at check time.
      security:
        - bae6Token: [tenant]
      responses: &tenantSettingResponses
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [auditEventId]
                properties:
                  auditEventId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [tenant]
      operationId: revokeTenantResourceAccess
      summary: Stop a principal or group from using a resource
      description: Same permission as granting. Seen by the next check.
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
  /v1/tenant/check:
    post:
      tags: [tenant]
      operationId: tenantCheck
      summary: Check the caller's own access to a tenant resource
      description: |
        Authenticated with a bae6 token issued to `bae6-authz`. The principal checked is the
        token's own `type:sub`, in the token's `tenant_id`; nothing in the body names a
        principal or tenant. `allowed` is true only when the resource's unit allows the
        action for that principal and no blocklist or denial applies. Unplaced or unknown
        resources are `false`. Tokens for groups cannot be checked (`403`). An authorization
        store outage, a timeout (2 s) or a model too complex to resolve is `503`; clients
        treat every non-200 response as a deny. Reads at higher consistency, so a revocation
        is seen on the next check.
      security:
        - bae6Token: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, resourceId]
              additionalProperties: false
              properties:
                resourceType:
                  enum: [application, api, model, agent_definition, prompt, mcp_server, dataset, document, tool, service_resource]
                resourceId:
                  type: string
                  pattern: "^[A-Za-z0-9_@.+|-]{1,256}$"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/tenant/ext-authz/{path}:
    get:
      tags: [tenant]
      operationId: tenantExtAuthz
      summary: Gateway external authorization for a tenant resource
      description: |
        For HTTP ext_authz filters (Envoy and similar). The same decision as `tenantCheck`,
        for the token's own principal, with the resource named by the gateway in the
        `bae6-resource` header (`<type>:<id>`) rather than a body. Any method and any
        sub-path is accepted so a gateway can forward the original request unchanged. The
        gateway must set the header itself and overwrite any client-supplied value. `200`
        with an empty body means allow; every other status is a deny.
      security:
        - bae6Token: [tenant]
      parameters:
        - name: path
          in: path
          required: false
          schema:
            type: string
        - name: bae6-resource
          in: header
          required: true
          schema:
            type: string
            pattern: "^[a-z_]{1,32}:[^:\\s]{1,256}$"
      responses:
        "200":
          description: Allowed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/tenant/units:
    post:
      tags: [tenant]
      operationId: createTenantUnit
      summary: Create an org unit under a parent
      description: |
        The actor is the token's principal and needs `settings_admin` on the parent. The new
        unit gets allow-all default allow-lists and must stay within the depth cap. The root
        unit is created by the operator command `node dist/tenant/bootstrap-root.js`, never
        over HTTP.
      security:
        - bae6Token: [tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit, parent]
              properties:
                unit: { $ref: "#/components/schemas/TenantUnit" }
                parent: { $ref: "#/components/schemas/TenantUnit" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [unit, parent, auditEventId]
                properties:
                  unit: { type: string }
                  parent: { type: string }
                  auditEventId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/tenant/units/{unit}/admins/{capability}/{subject}:
    parameters:
      - { $ref: "#/components/parameters/TenantUnit" }
      - { $ref: "#/components/parameters/TenantCapability" }
      - name: subject
        in: path
        required: true
        description: "`user:<id>`, `service:<id>` or `group:<id>#member`, percent-encoded."
        schema: { type: string }
    put:
      tags: [tenant]
      operationId: grantTenantAdmin
      summary: Grant a delegated admin capability on a unit
      description: The actor needs `can_grant_<capability>_admin` on the unit, which the unit's ceiling bounds.
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
    delete:
      tags: [tenant]
      operationId: revokeTenantAdmin
      summary: Revoke a delegated admin capability on a unit
      description: Same permission as granting. The root keeps at least one admin per capability (`409`).
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
  /v1/tenant/units/{unit}/ceilings/{capability}:
    parameters:
      - { $ref: "#/components/parameters/TenantUnit" }
      - { $ref: "#/components/parameters/TenantCapability" }
    put:
      tags: [tenant]
      operationId: setTenantCeiling
      summary: Allow a capability to be delegated at a unit
      description: The actor needs `can_set_<capability>_admin_ceiling`, held only by the parent's granters.
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
    delete:
      tags: [tenant]
      operationId: clearTenantCeiling
      summary: Stop a capability from being delegated at a unit
      description: Same permission as setting it. The root ceiling cannot be cleared (`409`).
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
  /v1/tenant/units/{unit}/guardrails/{action}/{list}/{subject}:
    parameters:
      - { $ref: "#/components/parameters/TenantUnit" }
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [application_use, api_call, model_invoke, agent_run, prompt_use, mcp_server_use, tool_invoke, dataset_query, document_read, service_call]
      - name: list
        in: path
        required: true
        schema: { type: string, enum: [allowlist, blocklist] }
      - name: subject
        in: path
        required: true
        description: "`<type>:<id>`, `<type>:*` or `group:<id>#member`, percent-encoded."
        schema: { type: string }
    put:
      tags: [tenant]
      operationId: setTenantGuardrail
      summary: Add a subject to a unit's allow-list or blocklist for an action
      description: The actor needs `can_set_guardrails` on the unit. Units below inherit it and can only tighten it.
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
    delete:
      tags: [tenant]
      operationId: clearTenantGuardrail
      summary: Remove a subject from a unit's allow-list or blocklist for an action
      security:
        - bae6Token: [tenant]
      responses: *tenantSettingResponses
  /v1/tenant/principals/{principalId}/unit:
    put:
      tags: [tenant]
      operationId: placePrincipal
      summary: Place a principal in an org unit
      description: |
        Authenticated with a bae6 token issued to `bae6-authz`; the actor is that token's
        principal and the tenant is its `tenant_id`. The actor needs `access_admin` on the
        unit, and on the unit the principal is leaving when it moves. authz tells authn
        before recording the placement, so a refused or failed push leaves authz unchanged;
        repeating the request is safe. Tokens minted after the push carry the new `org_path`;
        tokens already issued keep the old one until they expire (at most 300 s).
      security:
        - bae6Token: [tenant]
      parameters:
        - name: principalId
          in: path
          required: true
          schema:
            type: string
            pattern: "^prn_[0-9a-f]{32}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalType, unit]
              additionalProperties: false
              properties:
                principalType:
                  enum: [user, service, agent, application]
                unit:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      responses:
        "200":
          description: The principal is placed in the unit.
          content:
            application/json:
              schema:
                type: object
                required: [principalId, principalType, unit]
                properties:
                  principalId:
                    type: string
                  principalType:
                    type: string
                  unit:
                    type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/workload-bindings:
    post:
      tags: [workloads]
      operationId: bindWorkload
      summary: Allow a workload to check against an application
      description: |
        A workload (a verified token's issuer and `azp`, `client_id` or `sub`)
        may check only against the applications bound to it; it is granted the
        `check` scope and nothing else. Idempotent. Audited. Required scope:
        `bindings:write`, with an all-applications allow-list.
      security:
        - bearerAuth: [bindings:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadBinding"
      responses:
        "201":
          description: Bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadBinding"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [workloads]
      operationId: unbindWorkload
      summary: Remove a workload's binding to an application
      description: |
        Idempotent. Audited. Required scope: `bindings:write`, with an
        all-applications allow-list.
      security:
        - bearerAuth: [bindings:write]
      parameters:
        - name: issuer
          in: query
          required: true
          schema:
            type: string
        - name: workload
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Application"
      responses:
        "204":
          description: Not bound (removed, or it never was).
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/relationships:
    get:
      tags: [relationships]
      operationId: listRelationships
      summary: List relationship tuples
      description: |
        Returns tuples for one application only. Required scope: `relationships:read`.
      security:
        - bearerAuth: [relationships:read]
      parameters:
        - $ref: "#/components/parameters/Application"
        - name: object
          in: query
          description: >-
            Filter by one object, `type:id`. OpenFGA cannot list by type alone.
            `relation` requires `object`.
          schema:
            type: string
        - name: relation
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of tuples.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [relationships]
      operationId: writeRelationships
      summary: Write relationship tuples
      description: |
        Permission mutation: authorized and audited. At most 100 tuples.
        Required scope: `relationships:write`.
      security:
        - bearerAuth: [relationships:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipWrite"
      responses:
        "204":
          description: Written.
          headers:
            Bae6-Audit-Event-Id:
              description: ID of the audit event recorded for this change.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [relationships]
      operationId: deleteRelationship
      summary: Delete one relationship tuple
      description: |
        Permission mutation: authorized and audited. Deleting a tuple that does
        not exist is `404 not_found` (not idempotent, so mistakes are visible).
        Required scope: `relationships:write`.
      security:
        - bearerAuth: [relationships:write]
      parameters:
        - $ref: "#/components/parameters/Application"
        - name: subject
          in: query
          required: true
          description: Tuple subject, for example `user:anne` or `team:eng#member`.
          schema:
            type: string
        - name: relation
          in: query
          required: true
          schema:
            type: string
        - name: object
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
          headers:
            Bae6-Audit-Event-Id:
              description: ID of the audit event recorded for this change.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/models:
    get:
      tags: [models]
      operationId: listModels
      summary: List an application's authorization models
      description: "Required scope: `models:read`."
      security:
        - bearerAuth: [models:read]
      parameters:
        - $ref: "#/components/parameters/Application"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [models]
      operationId: submitModel
      summary: Validate a model and, if its assertions hold, bind it
      description: |
        Permission mutation: authorized and audited. The model (OpenFGA DSL) and the
        optional tuples are loaded into a scratch store and every assertion is checked
        there; the application's store and binding are untouched unless all assertions
        hold. Assertions must include at least one allow and one deny. On success a new
        immutable model is written and bound; the previous model stays as history and
        can be restored with `/v1/models/rollback`.
        Required scope: `models:write`.
      security:
        - bearerAuth: [models:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSubmit"
      responses:
        "201":
          description: Validated, written and bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          description: >-
            The model parsed but an assertion did not hold
            (`assertions_failed`), or it drops, repeats or changes a bae6-authz core type
            (`core_violation`); nothing was bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/models/{modelId}:
    get:
      tags: [models]
      operationId: getModel
      summary: Read a model this application has been bound to
      description: |
        Returns the model as OpenFGA DSL, so versions can be compared. Only a model
        recorded for this application is readable. Required scope: `models:read`.
      security:
        - bearerAuth: [models:read]
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9A-Z]{26}$"
        - $ref: "#/components/parameters/Application"
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema:
                type: object
                required: [id, model]
                properties:
                  id:
                    type: string
                  model:
                    type: string
                    description: OpenFGA DSL.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/models/rollback:
    post:
      tags: [models]
      operationId: rollbackModel
      summary: Re-bind a model the application was bound to before
      description: |
        Permission mutation: authorized and audited. Only a model already recorded for
        this application can be restored. Re-binding the active model is `409`.
        Required scope: `models:write`.
      security:
        - bearerAuth: [models:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRollback"
      responses:
        "200":
          description: Re-bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/explorer/check:
    post:
      tags: [explorer]
      operationId: explorerCheck
      summary: Check a permission on behalf of another principal
      description: |
        Answers "can `principal` hold `relation` on `object` in `application`?" for
        administrators. Unlike `/v1/check`, the caller names the principal, so this has its
        own scope and the caller's application allow-list applies. Every answered query
        is audited (`explorer.check`); if the audit event cannot be recorded, no answer is
        returned. Refused or invalid requests are not audited.
        Required scope: `explorer:check`.
      security:
        - bearerAuth: [explorer:check]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplorerCheckRequest"
      responses:
        "200":
          description: Decision, with the model that produced it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/providers/databricks:
    get:
      tags: [providers]
      operationId: getDatabricksProvider
      summary: Read an application's Databricks settings
      description: |
        Non-secret settings only. Credentials are never stored or returned: queries run
        with the end user's own token (ADR 0007). Required scope: `providers:read`, or
        `check` so the bound workload can read its own settings. The caller's application
        allow-list applies.
      security:
        - bearerAuth: [providers:read]
        - bearerAuth: [check]
      parameters:
        - $ref: "#/components/parameters/Application"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabricksProvider"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: The provider is not configured for this application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [providers]
      operationId: putDatabricksProvider
      summary: Create or replace an application's Databricks settings
      description: |
        Audited (`providers.put`); the audit event ID is in `Bae6-Audit-Event-Id`. Unknown
        fields, including any credential, are rejected. Required scope: `providers:write`;
        the caller's application allow-list applies.
      security:
        - bearerAuth: [providers:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabricksProviderRequest"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [providers]
      operationId: deleteDatabricksProvider
      summary: Remove an application's Databricks settings
      description: |
        Audited (`providers.delete`). Required scope: `providers:write`; the caller's
        application allow-list applies.
      security:
        - bearerAuth: [providers:write]
      parameters:
        - $ref: "#/components/parameters/Application"
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/audit:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: List audit events
      description: >-
        Required scope: `audit:read`. Only events for applications on the caller's
        allow-list are returned; `application` narrows that and never widens it.
        `from` is inclusive and `to` exclusive.
      security:
        - bearerAuth: [audit:read]
      parameters:
        - name: application
          in: query
          schema:
            $ref: "#/components/schemas/ApplicationId"
        - name: actor
          in: query
          description: Exact match on the subject that made the change.
          schema:
            type: string
            maxLength: 128
        - name: action
          in: query
          description: Exact match, for example `models.rollback`.
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of audit events, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Liveness
      description: The process is running. No authentication.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness
      description: |
        The API can reach its database and OpenFGA. No authentication.
        Not ready returns 503.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bae6Token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A bae6 token from bae6-authn with audience `bae6-authz`. Its only scope here is `tenant`.
        A deployment serves one organization; a token whose `tenant_id` differs is `401`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Workload credential. Scopes: `check`, `applications:read`,
        `applications:write`, `relationships:read`, `relationships:write`,
        `models:read`, `models:write`, `audit:read`, `explorer:check`, `providers:read`,
        `providers:write`. Check scopes are separate
        from administrative mutation scopes, and `explorer:check` (checking as another principal)
        is separate from `check`.
    endUserToken:
      type: apiKey
      in: header
      name: Bae6-End-User-Token
      description: |
        JWT of the end user a check is made for. The API verifies it and derives
        the principal `user:<sub>`; an unverifiable token is rejected
        (`invalid_end_user_token`), never replaced by a service identity.
        Deprecated: `Riz-End-User-Token` is still read when this header is absent, until
        the next major version.
  parameters:
    Application:
      name: application
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ApplicationId"
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TenantUnit:
      name: unit
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TenantUnit"
    TenantCapability:
      name: capability
      in: path
      required: true
      schema:
        type: string
        enum: [access, settings, app, budget, security]
  responses:
    Error:
      description: Error. The `code` is stable and machine-readable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                code: forbidden
                message: Caller is not permitted for this application.
                requestId: req_01HZX8
  schemas:
    TenantUnit:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    ApplicationId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      examples: [crm]
    WorkloadBinding:
      type: object
      required: [issuer, workload, application]
      additionalProperties: false
      properties:
        issuer:
          type: string
          description: The token issuer (`iss`) the workload authenticates with.
        workload:
          type: string
          description: The workload's `azp`, else `client_id`, else `sub`.
        application:
          $ref: "#/components/schemas/ApplicationId"
    ObjectRef:
      type: string
      description: OpenFGA object, `type:id`.
      pattern: "^[a-z_]+:[^\\s#]+$"
      examples: ["document:d1"]
    Decision:
      type: string
      enum: [allow, deny, indeterminate]
      description: |
        `indeterminate` means a decision could not be made and is never an allow.
        New values may be added; clients treat any unrecognized value as a deny.
    CheckRequest:
      type: object
      additionalProperties: false
      required: [application, relation, object]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        relation:
          type: string
          examples: [read]
        object:
          $ref: "#/components/schemas/ObjectRef"
        consistency:
          $ref: "#/components/schemas/Consistency"
    Consistency:
      type: string
      enum: [minimize_latency, higher_consistency]
      description: |
        How fresh the relationship data behind a decision must be. Omit it for the
        OpenFGA default, `minimize_latency`.

        - `minimize_latency`: may be served from OpenFGA's cache, so a recently revoked
          relationship can still be allowed until that cache entry expires.
        - `higher_consistency`: evaluated against the latest writes, so a revocation
          already committed to OpenFGA is seen. It costs more latency and datastore load.
    ExplorerCheckRequest:
      type: object
      additionalProperties: false
      required: [application, principal, relation, object]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        principal:
          type: string
          description: The end-user ID to check, as `user:<principal>`.
          pattern: "^[A-Za-z0-9._@+-]{1,128}$"
          examples: [anne]
        relation:
          type: string
          examples: [read]
        object:
          $ref: "#/components/schemas/ObjectRef"
    DatabricksConfig:
      type: object
      additionalProperties: false
      required: [workspaceHost, warehouseId]
      properties:
        workspaceHost:
          type: string
          description: A bare lower-case host name; no scheme, port, path or credentials.
          examples: [dbc-1234.cloud.databricks.com]
        warehouseId:
          type: string
          pattern: "^[A-Za-z0-9]{1,64}$"
    DatabricksProviderRequest:
      type: object
      additionalProperties: false
      required: [application, config]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        config:
          $ref: "#/components/schemas/DatabricksConfig"
    DatabricksProvider:
      type: object
      required: [application, provider, config]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        provider:
          type: string
          enum: [databricks]
        config:
          $ref: "#/components/schemas/DatabricksConfig"
    CheckResponse:
      type: object
      required: [status, requestId]
      properties:
        status:
          $ref: "#/components/schemas/Decision"
        requestId:
          type: string
        modelId:
          type: string
          description: Model that produced the decision. Absent when `indeterminate`.
        code:
          type: string
          description: |
            Present only when `status` is `indeterminate`: `timeout`,
            `backend_error` or `no_active_model`. New values may be added.
    BatchCheckItem:
      type: object
      additionalProperties: false
      required: [correlationId, relation, object]
      properties:
        correlationId:
          type: string
          minLength: 1
          maxLength: 64
          description: Caller-chosen, unique within the batch.
        relation:
          type: string
        object:
          $ref: "#/components/schemas/ObjectRef"
    BatchCheckRequest:
      type: object
      additionalProperties: false
      required: [application, checks]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        checks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BatchCheckItem"
        consistency:
          $ref: "#/components/schemas/Consistency"
    ListObjectsRequest:
      type: object
      additionalProperties: false
      required: [application, relation, type]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        relation:
          type: string
          examples: [read]
        type:
          type: string
          pattern: "^[a-z_]+$"
          examples: [document]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        cursor:
          type: string
          description: A previous page's `nextCursor`, unchanged.
        consistency:
          $ref: "#/components/schemas/Consistency"
    ListObjectsResponse:
      type: object
      required: [requestId, objects]
      properties:
        requestId:
          type: string
        modelId:
          type: string
          description: Absent when `code` is set.
        objects:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ObjectRef"
        nextCursor:
          type: string
          description: Present when more objects follow.
        code:
          type: string
          description: |
            Present only when the list could not be computed, with `objects` empty:
            `timeout`, `backend_error`, `no_active_model`, or `result_truncated` when the
            user holds more objects than authz can list completely. New values may be added.
    BatchCheckResult:
      type: object
      required: [correlationId, status]
      properties:
        correlationId:
          type: string
        status:
          $ref: "#/components/schemas/Decision"
    BatchCheckResponse:
      type: object
      required: [requestId, results]
      properties:
        requestId:
          type: string
        modelId:
          type: string
          description: Absent when no item could be decided.
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BatchCheckResult"
    ApplicationCreate:
      type: object
      description: |
        `name`, a hyphen and `environment` together must be at most 63 characters,
        the longest `ApplicationId`; a longer pair is `400 invalid_request`.
      additionalProperties: false
      required: [name, environment]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        environment:
          type: string
          pattern: "^[a-z0-9]{1,31}$"
          description: Lowercase letters and digits only, so the application `id` is unambiguous.
          examples: [prod]
    Application:
      type: object
      required: [id, name, environment, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
        environment:
          type: string
        createdAt:
          type: string
          format: date-time
    Caller:
      type: object
      required: [subject, scopes, applications]
      properties:
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
        applications:
          type: array
          description: Application IDs the caller may administer, or `*` for all.
          items:
            type: string
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        nextCursor:
          type: string
    Relationship:
      type: object
      additionalProperties: false
      required: [subject, relation, object]
      properties:
        subject:
          type: string
          description: Tuple subject, for example `user:anne` or `team:eng#member`.
        relation:
          type: string
        object:
          $ref: "#/components/schemas/ObjectRef"
    RelationshipWrite:
      type: object
      additionalProperties: false
      required: [application, relationships]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        relationships:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/Relationship"
    RelationshipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        nextCursor:
          type: string
    Model:
      type: object
      required: [id, createdAt, active]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
          description: Whether this model is the one the application is bound to.
    ModelAssertion:
      allOf:
        - $ref: "#/components/schemas/Relationship"
        - type: object
          required: [allowed]
          properties:
            allowed:
              type: boolean
              description: Whether the check is expected to be allowed.
    ModelSubmit:
      type: object
      additionalProperties: false
      required: [application, assertions]
      oneOf:
        - required: [model]
        - required: [extension]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        model:
          type: string
          maxLength: 200000
          description: >-
            A complete model in OpenFGA DSL. It must contain every bae6-authz core type exactly
            once and unchanged. Exactly one of `model` or `extension`.
        extension:
          type: string
          maxLength: 200000
          description: >-
            Types only (no `model` header) in OpenFGA DSL, composed after the bae6-authz core
            model, which it may reference but cannot redeclare. Exactly one of `model`
            or `extension`.
        tuples:
          type: array
          maxItems: 100
          description: Tuples loaded into the scratch store for the assertions only.
          items:
            $ref: "#/components/schemas/Relationship"
        assertions:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/ModelAssertion"
    ModelRollback:
      type: object
      additionalProperties: false
      required: [application, modelId]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationId"
        modelId:
          type: string
    ModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        nextCursor:
          type: string
    AuditEvent:
      type: object
      required: [id, time, actor, action, outcome]
      properties:
        id:
          type: string
        time:
          type: string
          format: date-time
        actor:
          type: string
          description: Verified identity that performed the action.
        action:
          type: string
          examples: [relationships.write]
        application:
          $ref: "#/components/schemas/ApplicationId"
        outcome:
          type: string
          enum: [success, denied, error]
        requestId:
          type: string
        detail:
          type: object
          description: >-
            Before/after summary of the change. Never contains tokens or protected data.
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: |
            Stable machine code. Known codes: `invalid_request`,
            `batch_too_large`, `duplicate_correlation_id`, `unauthenticated`,
            `invalid_end_user_token`, `forbidden`, `not_found`, `conflict`,
            `rate_limited`, `unavailable`, `internal`. New codes may be added;
            clients treat an unrecognized code as its HTTP status class.
        message:
          type: string
          description: Human-readable; never contains tokens or protected data.
        requestId:
          type: string
