tests:
  - name: admin capabilities cover the subtree, never ancestors or siblings
    check:
      - user: user:fred
        object: org_unit:payroll
        assertions: { access_admin: true }
      - user: user:fred
        object: org_unit:acme
        assertions: { access_admin: false }
      - user: user:fred
        object: org_unit:software
        assertions: { access_admin: false }
      - user: user:ian
        object: org_unit:newteam
        assertions: { app_admin: true, access_admin: false }

  - name: granting needs the capability and the node's ceiling
    check:
      - user: user:olga
        object: org_unit:acme
        assertions: { can_grant_access_admin: true }
      - user: user:fred
        object: org_unit:finance
        assertions: { can_grant_access_admin: true, can_grant_settings_admin: false }
      - user: user:fred
        object: org_unit:payroll
        assertions: { can_grant_access_admin: false }
      - user: user:olga
        object: org_unit:payroll
        assertions: { can_grant_access_admin: false }
      - user: user:fred
        object: org_unit:software
        assertions: { can_grant_access_admin: false }
      - user: user:pam
        object: org_unit:payroll
        assertions: { access_admin: true, can_grant_access_admin: false }

  - name: only the parent's granters set a node's ceiling, so nobody raises their own
    check:
      - user: user:fred
        object: org_unit:payroll
        assertions: { can_set_access_admin_ceiling: true }
      - user: user:pam
        object: org_unit:payroll
        assertions: { can_set_access_admin_ceiling: false }
      - user: user:fred
        object: org_unit:finance
        assertions: { can_set_access_admin_ceiling: false }
      - user: user:olga
        object: org_unit:finance
        assertions: { can_set_access_admin_ceiling: true }
      - user: user:olga
        object: org_unit:acme
        assertions: { can_set_access_admin_ceiling: false }

  - name: an inherited allow-list limits every node below it
    check:
      - user: user:alice
        object: model:finance-llm
        assertions: { can_invoke: true }
      - user: user:sam
        object: model:finance-llm
        assertions: { can_invoke: false }
      - user: user:sam
        object: model:payroll-llm
        assertions: { can_invoke: false }
      - user: user:alice
        object: model:payroll-llm
        assertions: { can_invoke: true }

  - name: an inherited block-list denies even a direct invoker
    check:
      - user: user:carl
        object: model:finance-llm
        assertions: { can_invoke: false }

  - name: a child tightens; a node with no allow-list fails closed
    check:
      - user: user:dave
        object: model:code-llm
        assertions: { can_invoke: true }
      - user: user:alice
        object: model:code-llm
        assertions: { can_invoke: false }
      - user: user:dave
        object: model:new-llm
        assertions: { can_invoke: false }

  - name: guardrails are per action
    check:
      - user: user:sam
        object: tool:ledger
        assertions: { can_invoke: true }

  - name: admins manage and grant resources below them but get no ordinary access
    check:
      - user: user:olga
        object: model:finance-llm
        assertions: { can_grant: true, can_invoke: false, can_manage: false }
      - user: user:fred
        object: model:code-llm
        assertions: { can_grant: false }
      - user: user:ian
        object: model:code-llm
        assertions: { can_manage: true, can_invoke: false }
      - user: user:sec
        object: org_unit:payroll
        assertions: { can_set_guardrails: true, can_read_audit: true }
      - user: user:sec
        object: org_unit:acme
        assertions: { can_set_guardrails: false }

  - name: every action applies its own allow-list and block-list
    check:
      - { user: user:alice, object: application:r1, assertions: { can_use: true } }
      - { user: user:sam, object: application:r1, assertions: { can_use: false } }
      - { user: user:blk0, object: application:r1, assertions: { can_use: false } }
